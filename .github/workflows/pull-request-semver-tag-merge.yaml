name: 'SemVer Tag on Main Merge'
on:
  pull_request:
    types:
      - closed
    branches:
      - main
permissions:
  pull-requests: read
  contents: write
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  semver-tag:
    name: 'Tag Repository with SemVer'
    if: |
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'skip-release') == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Parse the SemVer label
        id: label
        uses: Home-Office-Digital/core-cloud-match-label-action@v1
        with:
          labels: minor,major,patch
          mode: singular
      - name: Calculate SemVer value
        id: calculate
        uses: Home-Office-Digital/core-cloud-semver-calculate-action@v2
        with:
          increment: ${{ steps.label.outputs.matchedLabels }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Stops the version falling back to 0.0.0 after a skip-release merge.
          default_to_highest: true
      - name: Tag Repository
        uses: Home-Office-Digital/core-cloud-semver-tag-action@v4
        with:
          tag: ${{ steps.calculate.outputs.version }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
