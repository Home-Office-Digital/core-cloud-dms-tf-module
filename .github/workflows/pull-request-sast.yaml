name: Validate Terraform with Checkov, TFLint and Sonarqube
on:
  workflow_call:
    secrets:
      sonar_token:
        required: true
      sonar_host_url:
        required: true
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  RunTerraformValidation:
    name: Run Terraform SAST
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    runs-on: ubuntu-latest
    env:
      TF_INPUT: "false"
    steps:
      - name: Clone the Repository
        uses: actions/checkout@v7
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ~1.12.0
      - name: terraform init (no backend)
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/init@2f1e7a29dcbb7a9619698ab929cbb5b6a2dd0667 # 1.2.6
        with:
          use-backend: false
          terraform-version: ~1.12.0
      - name: Terraform tests
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/test@2f1e7a29dcbb7a9619698ab929cbb5b6a2dd0667 # 1.2.6
      # Run directly: the shared validate action sets continue-on-error, so it never fails the job.
      - name: terraform validate
        run: terraform validate
      - name: Terraform Format
        uses: Home-Office-Digital/core-cloud-workflow-terraform-actions/actions/fmt@2f1e7a29dcbb7a9619698ab929cbb5b6a2dd0667 # 1.2.6
        with:
          recursive: false
      - name: TFLint
        id: lint
        if: success() || failure()
        uses: Home-Office-Digital/core-cloud-workflow-tflint-scan@268b840d0e48fa86be281a5727909655311f7af4 # 0.3.2
  sonarqube-scanner:
    # Dependabot and fork PRs do not get the Sonar secrets.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
      && github.actor != 'dependabot[bot]'
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    uses: Home-Office-Digital/core-cloud-workflow-sonarqube-scan/.github/workflows/sonarqube-scan.yaml@43cc08418ced802ad127b754acd51f16b75bccbe # 1.3.0
    secrets:
      sonar_token: ${{ secrets.sonar_token }}
      sonar_host_url: ${{ secrets.sonar_host_url }}
  checkov-scan:
    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write
    uses: Home-Office-Digital/core-cloud-workflow-checkov-sast-scan/.github/workflows/checkov-scan-base.yaml@f784ad62383723a06856bf5fb4ef1332ca25d8dc # 1.22.3
